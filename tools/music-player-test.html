<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐自动选源测试</title>
<style>
  * { box-sizing: border-box } body { margin: 0; background: #f3f5f9; color: #18243b; font: 15px/1.6 system-ui, sans-serif }
  main { max-width: 900px; margin: 40px auto; padding: 20px } section { padding: 24px; margin: 16px 0; background: white; border: 1px solid #dce2ed; border-radius: 16px }
  h1,h2 { margin: 0 0 12px } p { color: #53627b } input,button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #c8d1e2 }
  input { width: min(65%,450px) } button { cursor: pointer; background: #245dcc; color: white } button:disabled { opacity: .5 }
  audio { width: 100%; margin-top: 12px } #cover { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; float: left; margin-right: 16px }
  #results { display: grid; gap: 10px } .song { display: flex; gap: 12px; align-items: center } .song span { flex: 1 }
  #lyrics { max-height: 250px; overflow: auto; margin-top: 16px } #lyrics button { display: block; width: 100%; text-align: left; background: transparent; color: #53627b; border: 0 }
  #lyrics button.active { color: #1646b1; background: #edf3ff } #status,#playStatus { white-space: pre-wrap } .error { color: #b42318 }
</style>
<main>
  <h1>音乐自动选源测试</h1>
  <p>统一搜索迟言与 ChKSz。密钥在博客后台的“音乐配置”中设置；本页验证播放、封面、快进、点击歌词与失败切源。</p>
  <section><form id="search"><input id="keyword" value="稻香" aria-label="歌曲或歌手" maxlength="80" required> <button id="searchButton">搜索</button></form><p id="status" role="status">等待搜索</p></section>
  <section><img id="cover" alt="歌曲封面" hidden><h2 id="title">尚未选择歌曲</h2><div id="artist"></div><audio id="audio" controls preload="metadata"></audio><p id="playStatus" role="status"></p><button id="fail" type="button" disabled>模拟失败，测试自动切源</button><div id="lyrics"></div></section>
  <section><h2>搜索结果</h2><div id="results"></div></section>
</main>
<script type="module">
import { attachMusicSourceFallback } from '/musicSourceFallback.js';
const $ = id => document.getElementById(id);
const audio = $('audio');
let dispose = () => {}, candidates = [], current = 0, lines = [], attempt = 0, resume = false;
async function api(path) {
  const response = await fetch('/api/v1/music/' + path);
  const body = await response.json();
  if (!response.ok || !body.success) throw new Error(body.message || body.msg || `HTTP ${response.status}`);
  return body.data;
}
function showLyrics(text) {
  lines = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const words = line.replace(/\[[^\]]*\]/g, '').trim();
    for (const m of line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)) if (words) lines.push({ time: +m[1] * 60 + +m[2], text: words });
  });
  lines.sort((a,b) => a.time-b.time); $('lyrics').replaceChildren();
  for (const line of lines) {
    const button = document.createElement('button'); button.textContent = line.text;
    button.onclick = () => { audio.currentTime = line.time; audio.play().catch(() => {}); };
    $('lyrics').append(button);
  }
  if (!lines.length) $('lyrics').textContent = '暂无可用歌词';
}
function change(candidate, index) {
  current = index; showLyrics(candidate.lyric);
  $('playStatus').textContent = `自动播放 · 候选 ${index + 1}/${candidates.length}`;
  $('cover').hidden = !candidate.cover; $('cover').src = candidate.cover || '';
}
async function play(item) {
  const id = ++attempt; dispose(); audio.pause(); audio.removeAttribute('src'); audio.load(); resume = true;
  $('playStatus').textContent = '正在解析可用播放源…';
  try {
    const track = await api('resolve?rid=' + encodeURIComponent(item.rid)); if (id !== attempt) return;
    candidates = track.candidates; $('title').textContent = item.name; $('artist').textContent = item.artist;
    dispose = attachMusicSourceFallback(audio, candidates, {
      shouldResume: () => resume, onChange: change,
      onExhausted: () => { $('playStatus').textContent = '所有候选均无法播放'; $('fail').disabled = true; }
    });
    change(candidates[0], 0); audio.src = candidates[0].url; audio.load(); $('fail').disabled = candidates.length < 2;
    await audio.play();
  } catch (e) { if (id === attempt) $('playStatus').textContent = e.message; }
}
$('search').onsubmit = async e => {
  e.preventDefault(); $('searchButton').disabled = true; $('status').textContent = '正在合并搜索结果…'; $('status').className = '';
  try {
    const items = await api('search?keyword=' + encodeURIComponent($('keyword').value.trim())); $('results').replaceChildren();
    for (const item of items) {
      const row = document.createElement('div'); row.className = 'song';
      const name = document.createElement('span'); name.textContent = `${item.name} · ${item.artist}`;
      const button = document.createElement('button'); button.textContent = '播放 / 检测'; button.onclick = () => play(item);
      row.append(name,button); $('results').append(row);
    }
    $('status').textContent = `找到 ${items.length} 首歌曲，播放时自动选择可用候选。`;
  } catch (e) { $('status').textContent = e.message; $('status').className = 'error'; }
  finally { $('searchButton').disabled = false; }
};
$('fail').onclick = () => audio.dispatchEvent(new Event('error'));
audio.onplay = () => { resume = true; }; audio.onpause = () => { if (!audio.error && audio.readyState >= 2) resume = false; };
audio.ontimeupdate = () => {
  let active = -1; lines.forEach((line,index) => { if (audio.currentTime >= line.time) active = index; });
  [...$('lyrics').children].forEach((row,index) => row.classList.toggle('active', index === active));
};
$('cover').onerror = () => { $('cover').hidden = true; };
</script>
</html>
