services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-blog-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog_system}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-blog_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-blog_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-blog_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in .env}
      BLOG_BACKUP_DB_USERNAME: ${BLOG_BACKUP_DB_USERNAME:-blog_backup}
      BLOG_BACKUP_DB_PASSWORD: ${BLOG_BACKUP_DB_PASSWORD:?set BLOG_BACKUP_DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/ops:/opt/blog-ops:ro
      - ./scripts/ops/init-db-roles.sh:/docker-entrypoint-initdb.d/10-blog-roles.sh:ro
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=35"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - blog-network

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-blog-redis}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set independent REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/opt/blog-ops/start-redis.sh"]
    volumes:
      - redis-data:/data
      - ./scripts/ops/start-redis.sh:/opt/blog-ops/start-redis.sh:ro
    tmpfs: ["/tmp:size=1m,mode=1777"]
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 4
    logging: *bounded-logs
    networks:
      - blog-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        JDK_BUILD_IMAGE: ${JDK_BUILD_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jdk-alpine}
        JRE_RUNTIME_IMAGE: ${JRE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jre-alpine}
    container_name: ${BACKEND_CONTAINER_NAME:-blog-backend}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 运行环境：.env 中 BLOG_ENV（dev/prod），Compose 默认 prod
      BLOG_ENV: ${BLOG_ENV:-prod}
      SPRING_PROFILES_ACTIVE: ${BLOG_ENV:-prod}
      SERVER_PORT: 8080
      # Docker 内固定走服务名，无需在 .env 写 DB_URL / REDIS_HOST
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blog_system}
      DB_USERNAME: ${DB_USERNAME:-blog_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      DB_POOL_MIN: 1
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blog_system}
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USERNAME:-blog_migrator}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      BLOG_BACKUP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blog_system}
      BLOG_BACKUP_DB_USERNAME: ${BLOG_BACKUP_DB_USERNAME:-blog_backup}
      BLOG_BACKUP_DB_PASSWORD: ${BLOG_BACKUP_DB_PASSWORD:?set BLOG_BACKUP_DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set independent REDIS_PASSWORD in .env}
      REDIS_DATABASE: 0
      BLOG_ADMIN_USERNAME: ${BLOG_ADMIN_USERNAME:-admin}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD:?set BLOG_ADMIN_PASSWORD in .env}
      BLOG_ADMIN_DISPLAY_NAME: ${BLOG_ADMIN_DISPLAY_NAME:-站点管理员}
      UPLOAD_ROOT_DIR: /app/uploads
      BLOG_BACKUP_DIR: /app/backups
      BLOG_BACKUP_RETENTION_COUNT: ${BLOG_BACKUP_RETENTION_COUNT:-7}
      BLOG_BACKUP_REPLICA_DIR: ${BLOG_BACKUP_REPLICA_DIR:-}
      BLOG_TRUSTED_PROXY_CIDRS: ${BLOG_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      BLOG_TRUSTED_PROXY_COUNT: ${BLOG_TRUSTED_PROXY_COUNT:-1}
      BLOG_OUTBOUND_PRIVATE_HOST_ALLOWLIST: ${BLOG_OUTBOUND_PRIVATE_HOST_ALLOWLIST:-localhost,127.0.0.1,::1}
      BLOG_CORS_ALLOWED_ORIGINS: ${BLOG_CORS_ALLOWED_ORIGINS:-}
      BLOG_NOTIFY_BASE_URL: ${BLOG_NOTIFY_BASE_URL:-http://localhost:3000}
      BLOG_NOTIFY_API_KEY: ${BLOG_NOTIFY_API_KEY:-}
      BLOG_NOTIFY_TIMEOUT_SECONDS: ${BLOG_NOTIFY_TIMEOUT_SECONDS:-10}
      BLOG_NOTIFICATION_PAYLOAD_KEY: ${BLOG_NOTIFICATION_PAYLOAD_KEY:-${BLOG_BACKUP_ENCRYPTION_KEY}}
      FILE_MANAGER_BASE_URL: ${FILE_MANAGER_BASE_URL:-}
      FILE_MANAGER_API_PREFIX: ${FILE_MANAGER_API_PREFIX:-/api}
      FILE_MANAGER_APP_ID: ${FILE_MANAGER_APP_ID:-}
      FILE_MANAGER_APP_SECRET: ${FILE_MANAGER_APP_SECRET:-}
      BLOG_DOWNLOAD_SECRET_KEY: ${BLOG_DOWNLOAD_SECRET_KEY:?set BLOG_DOWNLOAD_SECRET_KEY in .env}
      BLOG_TOTP_SECRET_KEY: ${BLOG_TOTP_SECRET_KEY:-}
      BLOG_API_PAYLOAD_SECRET: ${BLOG_API_PAYLOAD_SECRET:?set BLOG_API_PAYLOAD_SECRET in .env}
      BLOG_BACKUP_ENCRYPTION_KEY: ${BLOG_BACKUP_ENCRYPTION_KEY:?set BLOG_BACKUP_ENCRYPTION_KEY in .env}
      # 单一站点地址：有域名填 BLOG_SITE_URL；留空则运行时按请求 Host 自动识别
      BLOG_SITE_URL: ${BLOG_SITE_URL:-}
      BLOG_PUBLIC_SITE_URL: ${BLOG_SITE_URL:-}
      # 容器内体检固定走 compose 网络前台服务
      BLOG_HEALTH_SITE_URL: http://frontend:3256
      BLOG_MUSIC_API_KEY: ${BLOG_MUSIC_API_KEY:-}
      BLOG_MUSIC_NETEASE_API_KEY: ${BLOG_MUSIC_NETEASE_API_KEY:-}
      WECHAT_MINI_PROGRAM_APP_ID: ${WECHAT_MINI_PROGRAM_APP_ID:-}
      WECHAT_MINI_PROGRAM_APP_SECRET: ${WECHAT_MINI_PROGRAM_APP_SECRET:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_CPUS:-0.75}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logs
    networks:
      - blog-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        BLOG_BACKEND_ORIGIN: http://backend:8080
        NUXT_PUBLIC_API_PAYLOAD_SECRET: ${BLOG_API_PAYLOAD_SECRET:?set BLOG_API_PAYLOAD_SECRET in .env}
        VITE_API_PAYLOAD_SECRET: ${BLOG_API_PAYLOAD_SECRET:?set BLOG_API_PAYLOAD_SECRET in .env}
        BLOG_ADMIN_BASE_PATH: ${BLOG_ADMIN_BASE_PATH:-/admin}
    container_name: ${FRONTEND_CONTAINER_NAME:-blog-frontend}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BLOG_ENV: ${BLOG_ENV:-prod}
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3256
      BLOG_BACKEND_ORIGIN: http://backend:8080
      # 与后端共用 BLOG_SITE_URL；留空则 Nuxt 按访问地址自动识别
      NUXT_PUBLIC_SITE_URL: ${BLOG_SITE_URL:-}
      BLOG_ADMIN_BASE_PATH: ${BLOG_ADMIN_BASE_PATH:-/admin}
      NUXT_PUBLIC_API_PAYLOAD_SECRET: ${BLOG_API_PAYLOAD_SECRET:-}
      SENIVERSE_WIDGET_TOKEN: ${SENIVERSE_WIDGET_TOKEN:-}
      NUXT_SENIVERSE_WIDGET_TOKEN: ${SENIVERSE_WIDGET_TOKEN:-}
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3256}:3256"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logs
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:?set existing POSTGRES_VOLUME_NAME before deployment}
  redis-data:
    name: ${REDIS_VOLUME_NAME:?set existing REDIS_VOLUME_NAME before deployment}
  uploads-data:
    name: ${UPLOADS_VOLUME_NAME:?set existing UPLOADS_VOLUME_NAME before deployment}
  backups-data:
    name: ${BACKUPS_VOLUME_NAME:-blog-backups-data}
