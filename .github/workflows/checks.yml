name: Build and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Maven dependency CVE scan
        run: ./mvnw -B org.owasp:dependency-check-maven:12.2.0:check -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-security-reports
          path: |
            backend/target/surefire-reports
            backend/target/dependency-check-report.*
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dashboard/package-lock.json
      - run: npm ci --prefix frontend && npm ci --prefix dashboard
      - run: npm run test --prefix frontend
      - run: npm run typecheck --prefix frontend && npm run typecheck --prefix dashboard
      - run: npm run lint --prefix frontend && npm run lint --prefix dashboard
      - run: npm run build --prefix dashboard && npm run build --prefix frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high && npm audit --prefix dashboard --omit=dev --audit-level=high
  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 40
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          load: true
          tags: blog-${{ matrix.target }}:ci
          build-args: |
            JDK_BUILD_IMAGE=eclipse-temurin:17-jdk-alpine
            JRE_RUNTIME_IMAGE=eclipse-temurin:17-jre-alpine
            NODE_IMAGE=node:22-alpine
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: blog-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify runtime drops root
        run: test "$(docker image inspect blog-${{ matrix.target }}:ci --format '{{.Config.User}}')" != '' && test "$(docker image inspect blog-${{ matrix.target }}:ci --format '{{.Config.User}}')" != root
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/ops -v
      - run: bash -n scripts/ops/*.sh
